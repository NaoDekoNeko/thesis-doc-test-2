name: CD

on:
  push:
    branches: [master]

permissions:
  contents: read
  id-token: write

jobs:
  deploy:
    name: Build → Deploy GCS
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 9

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - run: pnpm build

      - name: Autenticar en GCP (OIDC)
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ secrets.WIF_PROVIDER }}
          service_account: ${{ secrets.WIF_SERVICE_ACCOUNT }}

      - uses: google-github-actions/setup-gcloud@v2

      - name: Deploy a GCS
        run: gcloud storage rsync -R --delete-unmatched-destination-objects ./build gs://${{ secrets.GCS_BUCKET }}

  index:
    name: Indexar docs en RAG
    runs-on: ubuntu-latest
    needs: deploy
    if: |
      contains(join(github.event.commits.*.modified, ' '), 'docs/') ||
      contains(join(github.event.commits.*.added, ' '), 'docs/')

    steps:
      - uses: actions/checkout@v4

      - uses: NaoDekoNeko/thesis-rag-microservice/indexer@master
        with:
          docs-path: ${{ github.workspace }}/docs
          doc-folder: thesis-doc-test-2
          clear: 'true'
          gemini-api-key: ${{ secrets.GEMINI_API_KEY }}
          db-host: ${{ secrets.DB_HOST }}
          db-name: ${{ secrets.DB_NAME }}
          db-user: ${{ secrets.DB_USER }}
          db-password: ${{ secrets.DB_PASSWORD }}
